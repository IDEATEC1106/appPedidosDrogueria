name: Compilar APK de Flutter

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Construir APK en Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código fuente
        uses: actions/checkout@v4

      - name: 2. Configurar entorno de Java (OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Configurar SDK de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: 4. Instalar dependencias del proyecto
        run: flutter pub get
        working-directory: appPedidosDrogueria

      - name: 5. Compilar APK en modo Release
        run: flutter build apk --release
        working-directory: appPedidosDrogueria

      - name: 6. Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: appPedidosDrogueria/build/app/outputs/flutter-apk/app-release.apk
